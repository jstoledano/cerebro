{% extends 'cerebro/base.html' %}

{% block title %}CECyRD{% endblock %}

{% block content %}
<section class="space-y-6 p-6">
  <header class="rounded-3xl border border-base-300 bg-base-100 p-8 shadow-lg">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div class="flex items-center gap-4">
        <div class="grid h-16 w-16 place-items-center rounded-2xl bg-primary/10 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z" />
          </svg>
        </div>
        <div>
          <h1 class="text-3xl font-bold text-base-content">Evaluación de CECyRD</h1>
          <p class="mt-1 max-w-2xl text-sm text-base-content/70">
            Cuadro de mando del proveedor. Consulta los tiempos de disponibilidad, volumen de producción y cumplimiento.
          </p>
        </div>
      </div>
      <div class="flex flex-col items-stretch gap-3 text-right">
        <div class="flex items-center justify-end gap-2">
          <span class="badge badge-outline badge-primary badge-lg">SGC</span>
          <span class="text-sm text-base-content/60">Base de datos lista</span>
        </div>
        <a href="{% url 'cecyrd:carga' %}" class="btn btn-primary btn-sm mt-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 mr-1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>
          Cargar Trámites
        </a>
      </div>
    </div>
  </header>

  <div id="dashboard-container" class="mt-8">
      </div>
</section>
{% endblock content %}
