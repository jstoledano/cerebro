<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notificación{% endblock %}</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
            color: #454248;
            margin: 0;
            padding: 24px 12px;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #c5c9cc;
        }

        .header {
            padding: 24px 28px;
            background-color: #ffffff;
            border-bottom: 4px solid #454248;
        }

        .header img {
            display: block;
            max-width: 220px;
            width: 100%;
            height: auto;
        }

        .content {
            padding: 28px;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            color: #454248;
            margin-top: 0;
        }

        p {
            margin: 0 0 14px;
        }

        a {
            color: #454248;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 22px 0;
        }

        th {
            background-color: #454248;
            color: #ffffff;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #c5c9cc;
            vertical-align: top;
        }

        tr:nth-child(even) td {
            background-color: #f7f5f3;
        }

        .footer {
            max-width: 680px;
            margin: 0 auto;
            padding: 18px 28px;
            text-align: center;
            font-size: 12px;
            color: #828a91;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <img
                src="http://10.29.0.35/assets/img/logo2026/LOGO-COLOR-1.png"
                alt="Instituto Nacional Electoral"
            >
        </div>

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

    </div>

    <div class="footer">
        <p>Cuadro de Mando Integral · Junta Local Ejecutiva en Tlaxcala</p>
        <p>Este es un mensaje automático. Por favor, no responda a este correo.</p>
    </div>

</body>
</html>
